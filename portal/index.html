<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>罗峪村 · 数字家园</title>
<style>
/* ══════════ v2：统一视觉语言 = 一套线性描边图标（stroke 1.8 / round cap / 24 网格）+ 单一织锦纹样 ══════════ */
:root {
  --paper:   #F7F2E7;
  --card:    #FFFDF6;
  --ink:     #2B2B26;
  --ink-2:   #6E6A5E;
  --green:   #3F5D45;   /* 黛青：积分 */
  --clay:    #C25B3F;   /* 土红：村务 */
  --indigo:  #2F4858;   /* 蜡染蓝：资源 */
  --gold:    #C9A227;   /* 织锦金：仅纹样 */
  --line:    #E4DCC8;
  --serif: "Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --sans:  "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  min-height:100vh;
  display:flex; flex-direction:column;
}

/* 唯一纹样元素：织锦带（顶部粗、底部细） */
.braid {
  height: 12px;
  background:
    repeating-linear-gradient(45deg,  transparent 0 5px, rgba(255,255,255,.22) 5px 7px),
    repeating-linear-gradient(-45deg, transparent 0 5px, rgba(0,0,0,.10)     5px 7px),
    linear-gradient(90deg, var(--clay) 0 25%, var(--gold) 25% 50%, var(--green) 50% 75%, var(--indigo) 75% 100%);
}
.braid.thin { height: 5px; opacity:.8; }

/* ── 页头：线描村徽 + 宋体标题 ── */
header {
  text-align:center;
  padding: 56px 20px 40px;
}
.crest {
  width: 88px; height: 88px;
  margin: 0 auto 20px;
  color: var(--green);
  display:block;
}
header h1 {
  font-family: var(--serif);
  font-size: clamp(26px, 4.5vw, 40px);
  letter-spacing: .14em;
  color: var(--ink);
}
header .sub {
  margin-top: 12px;
  color: var(--ink-2);
  font-size: 14.5px;
  letter-spacing: .1em;
}

/* ── 主体：三枚等宽大按钮 ── */
main {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 8px 24px 72px;
  flex:1;
}
.btns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 158px;
  padding: 24px 16px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  text-decoration: none;
  color: var(--ink);
  transition: transform .16s, box-shadow .16s, border-color .16s;
}
.btn svg { width: 34px; height: 34px; }
.btn .nm {
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: .08em;
}
.btn .ds {
  font-size: 12.5px;
  color: var(--ink-2);
  text-align: center;
  line-height: 1.6;
}
.btn.b-green  { color: var(--green); }
.btn.b-clay   { color: var(--clay); }
.btn.b-indigo { color: var(--indigo); }
.btn .nm { color: var(--ink); }
.btn:hover {
  transform: translateY(-4px);
  border-color: currentColor;
  box-shadow: 0 10px 24px rgba(43,43,38,.10);
}

/* ── 页脚 ── */
footer {
  text-align:center;
  padding: 0 20px 34px;
  color: var(--ink-2);
  font-size: 12px;
  letter-spacing:.04em;
}
footer .braid-holder { max-width: 260px; margin: 0 auto 14px; }

@media (max-width: 700px) {
  .btns { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; }
  .btn { min-height: 110px; flex-direction: row; justify-content: flex-start; text-align: left; padding: 20px 24px; gap: 16px; }
  .btn .ds { text-align: left; }
}
</style>
</head>
<body>

<div class="braid"></div>

<header>
  <!-- 线描村徽：稻穗环 + 山 + 河（统一描边语言） -->
  <svg class="crest" viewBox="0 0 88 88" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="44" cy="44" r="39"/>
    <circle cx="44" cy="44" r="31" stroke-dasharray="2.5 5"/>
    <path d="M18 58 L33 40 L42 47 L55 34 L70 58"/>
    <path d="M24 66 q4 -3 8 0 q4 3 8 0 q4 -3 8 0 q4 3 8 0 q4 -3 8 0"/>
    <path d="M44 30 v-12 M39 22 l5 -4 5 4"/>
    <path d="M12 44 h-6 M82 44 h6 M44 12 v-6 M44 82 v6"/>
  </svg>
  <h1>罗峪村 · 数字家园</h1>
</header>

<main>
  <div class="btns">

    <!-- ① 积分系统：铜钱 -->
    <a class="btn b-green" href="https://luoyu.goodsport.fun/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <rect x="8.2" y="8.2" width="7.6" height="7.6" rx="0.6"/>
        <path d="M12 4.5 V3 M12 21 v-1.5"/>
      </svg>
      <span class="nm">村民积分</span>
      <span class="ds">签到 · 排行 · 兑换</span>
    </a>

    <!-- ② 村务助理（定位到移动工作台）：瓦房 -->
    <a class="btn b-clay" href="https://luoyu.goodsport.fun/cunwu/work.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10.5 L12 4 L20 10.5"/>
        <path d="M6.5 9.5 V19 H17.5 V9.5"/>
        <path d="M10.2 19 v-5 h3.6 v5"/>
      </svg>
      <span class="nm">村务助理</span>
      <span class="ds">档案 · 事务 · 罗小峪问答</span>
    </a>

    <!-- ③ 村域全景：山水 -->
    <a class="btn b-indigo" href="https://luoyu.goodsport.fun/cunwu/assets.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17 L8.5 11 L12 14 L16.5 8.5 L21 17"/>
        <path d="M3 21 h18"/>
        <path d="M7.5 14.5 q2 -2.5 4 0 q2 2.5 4 0"/>
      </svg>
      <span class="nm">村域全景</span>
      <span class="ds">田林地水 · 资产地图 · 产业</span>
    </a>

  </div>
</main>

<footer>
  <div class="braid-holder"><div class="braid thin"></div></div>
  <p>罗峪村数字家园 · 聚合入口设计稿 v2</p>
</footer>

</body>
</html>
